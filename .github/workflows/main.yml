name: Build & Generate Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Generate Minecraft sources
        run: gradle genSources --no-daemon --stacktrace

      - name: List generated sources jars
        run: find . -name '*sources*.jar' -not -path './.git/*' -print || true

      - name: Upload generated sources
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-generated-sources
          path: |
            **/*-sources.jar
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Run logic tests
        run: |
          javac -d logic-out src/main/java/com/knmusic/ethylene/lod/LodPolicy.java src/main/java/com/knmusic/ethylene/mob/MobDensityPolicy.java tests/EthyleneLogicTest.java
          java -ea -cp logic-out com.knmusic.ethylene.EthyleneLogicTest

      - name: Build mod jar
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Annotation hiển thị trên trang job, không cần đăng nhập
            grep -n -E 'What went wrong|error:|^e: |FAILURE:|Could not ' build.log | head -20 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | tr -d '\r' | sed -e 's/%/%25/g')
              echo "::error title=Build error::$msg"
            done
            {
              echo "## Build thất bại (exit code $status)"
              echo ""
              echo "### Các dòng lỗi"
              echo '```'
              grep -n -E 'What went wrong|error:|^e: |FAILURE:|Could not |Exception' build.log | head -150 || true
              echo '```'
              echo "### 300 dòng cuối của log"
              echo '```'
              tail -n 300 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          tail -n 300 build.log
          exit "$status"

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: ethylene-jar
          path: build/libs/*.jar
          if-no-files-found: error
