name: Build & Generate Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Generate Minecraft sources
        run: gradle genSources --no-daemon --stacktrace

      - name: List generated sources jars
        run: find . -name '*sources*.jar' -not -path './.git/*' -print || true

      - name: Upload generated sources
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-generated-sources
          path: |
            **/*-sources.jar
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Build mod jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: ethylene-jar
          path: build/libs/*.jar
          if-no-files-found: error
